<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un pequeño regalo🌻</title>
    <style>
        body {
            background-color: #E8B4B8;
            color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

       
        .particulas-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .particula {
            position: absolute;
            list-style: none;
            display: block;
            border-radius: 50%;
            /* Efecto de burbuja 3D brillante y definido */
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), rgba(255, 215, 0, 0.5) 60%, rgba(245, 127, 23, 0.4));
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(255, 179, 0, 0.5), inset -2px -2px 6px rgba(255, 255, 255, 0.7);
            bottom: -100px;
            animation: flotar 14s infinite linear;
        }

        .particula:nth-child(1) { left: 8%; width: 32px; height: 32px; animation-delay: 0s; animation-duration: 11s; }
        .particula:nth-child(2) { left: 22%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 9s; }
        .particula:nth-child(3) { left: 38%; width: 26px; height: 26px; animation-delay: 4s; }
        .particula:nth-child(4) { left: 52%; width: 38px; height: 38px; animation-delay: 0s; animation-duration: 15s; }
        .particula:nth-child(5) { left: 68%; width: 22px; height: 22px; animation-delay: 1.5s; }
        .particula:nth-child(6) { left: 78%; width: 34px; height: 34px; animation-delay: 3s; animation-duration: 13s; }
        .particula:nth-child(7) { left: 88%; width: 18px; height: 18px; animation-delay: 6s; }
        .particula:nth-child(8) { left: 94%; width: 28px; height: 28px; animation-delay: 4.5s; animation-duration: 10s; }

        @keyframes flotar {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0.9;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.1) rotate(360deg);
                opacity: 0;
            }
        }

        
        .pantalla-inicio {
            text-align: center;
            animation: aparecer 1s ease-in-out;
            z-index: 1;
        }

        .pantalla-inicio h2 {
            color: #000;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .btn-abrir {
            background: linear-gradient(135deg, #ffb300, #f57f17);
            color: #0d1117;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 179, 0, 0.4);
            transition: all 0.3s ease;
        }

        .btn-abrir:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 25px rgba(255, 179, 0, 0.6);
        }

       
        .contenedor-ramo {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        canvas {
            background: transparent;
        }

      
        .contenedor-texto {
            margin-top: 10px;
            text-align: center;
            max-width: 480px;
            padding: 0 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 2s ease, transform 2s ease;
        }

        .contenedor-texto.visible {
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            color: #000;
            font-size: 26px;
            margin-bottom: 10px;
            text-shadow: 0 0 12px rgba(255, 202, 40, 0.4);
        }

        p {
            color: #000;
            font-size: 16px;
            line-height: 1.6;
        }

        .btn-repetir {
            margin-top: 15px;
            background: transparent;
            border: 1px solid #e97405;
            color: #0e0d0d;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-repetir:hover {
            background: #FFFACD;
            color: #0d1117;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <ul class="particulas-fondo">
        <li class="particula"></li>
        <li class="particula"></li>
        <li class="particula"></li>
        <li class="particula"></li>
        <li class="particula"></li>
        <li class="particula"></li>
        <li class="particula"></li>
        <li class="particula"></li>
    </ul>

    
    <div class="pantalla-inicio" id="pantallaInicio">
        <h2>✨ Adivina que hay aquí ✨</h2>
        <button class="btn-abrir" onclick="iniciarSorpresa()">Presiona para ver la magia </button>
    </div>

    <!-- Vista 2: Dibujo del Ramo y Texto -->
    <div class="contenedor-ramo" id="contenedorRamo">
        <canvas id="lienzoGirasol" width="450" height="480"></canvas>

        <div class="contenedor-texto" id="textoSorpresa">
            <h1>🌻 De mí para tú 🌻</h1>
            <p>Es un regalo sencillo pero que hice con cariño para tí, espero sacarte una sonrisa y ojalá te haya gustado</p>
            <button class="btn-repetir" onclick="reiniciarAnimacion()">Ver la magia otra vez☺</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('lienzoGirasol');
        const ctx = canvas.getContext('2d');

        
        const flores = [
            { x: 140, y: 170, escala: 0.65, inicioFrame: 40, cpX: 180, cpY: 300 }, // Izquierda
            { x: 310, y: 170, escala: 0.65, inicioFrame: 60, cpX: 270, cpY: 300 }, // Derecha
            { x: 225, y: 120, escala: 0.80, inicioFrame: 80, cpX: 225, cpY: 280 }  // Centro (Principal)
        ];

        const puntoAtadoX = 225;
        const puntoAtadoY = 410;
        const totalSemillas = 180;

        let frame = 0;
        let idAnimacion = null;

        
        function dibujarTallos(progreso) {
            flores.forEach(f => {
                ctx.beginPath();
                ctx.moveTo(f.x, f.y);

              
                let currX = f.x + (puntoAtadoX - f.x) * progreso;
                let currY = f.y + (puntoAtadoY - f.y) * progreso;
                let currCpX = f.x + (f.cpX - f.x) * progreso;
                let currCpY = f.y + (f.cpY - f.y) * progreso;

                ctx.quadraticCurveTo(currCpX, currCpY, currX, currY);
                ctx.lineWidth = 10 * f.escala;
                ctx.strokeStyle = '#2e7d32';
                ctx.lineCap = 'round';
                ctx.stroke();
            });
        }

        
        function dibujarHojas(progreso) {
            if (progreso <= 0) return;
            ctx.save();
            ctx.globalAlpha = progreso;
            ctx.fillStyle = '#388e3c';

            
            ctx.beginPath();
            ctx.moveTo(170, 290);
            ctx.quadraticCurveTo(90, 270, 110, 320);
            ctx.quadraticCurveTo(160, 330, 170, 290);
            ctx.fill();

            
            ctx.beginPath();
            ctx.moveTo(280, 290);
            ctx.quadraticCurveTo(360, 270, 340, 320);
            ctx.quadraticCurveTo(290, 330, 280, 290);
            ctx.fill();

            ctx.restore();
        }

        
        function dibujarPetalo(cx, cy, angulo, escala) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angulo);
            ctx.scale(escala, escala);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-13, -47, 0, -90);
            ctx.quadraticCurveTo(13, -47, 0, 0);

            let gradiente = ctx.createLinearGradient(0, 0, 0, -90);
            gradiente.addColorStop(0, '#f57f17');
            gradiente.addColorStop(0.5, '#ffb300');
            gradiente.addColorStop(1, '#ffee58');

            ctx.fillStyle = gradiente;
            ctx.fill();
            ctx.restore();
        }

        
        function dibujarFlor(f, frameActual) {
            if (frameActual < f.inicioFrame) return;

            const numPetalos = 22;
            let petalosVisibles = Math.floor((frameActual - f.inicioFrame) / 1.5);

            
            for (let i = 0; i < Math.min(petalosVisibles, numPetalos); i++) {
                dibujarPetalo(f.x, f.y, (i * Math.PI * 2) / numPetalos, f.escala);
            }
            
            for (let i = 0; i < Math.max(0, petalosVisibles - numPetalos); i++) {
                dibujarPetalo(f.x, f.y, ((i + 0.5) * Math.PI * 2) / numPetalos, f.escala);
            }

            
            let semillasVisibles = Math.floor((frameActual - f.inicioFrame - 35) * 2.5);
            if (semillasVisibles > 0) {
                const radioCentro = 42 * f.escala;

                ctx.beginPath();
                ctx.arc(f.x, f.y, radioCentro, 0, Math.PI * 2);
                ctx.fillStyle = '#3e2723';
                ctx.fill();

                const anguloOro = Math.PI * (3 - Math.sqrt(5));
                for (let i = 0; i < Math.min(semillasVisibles, totalSemillas); i++) {
                    const r = Math.sqrt(i) * (2.8 * f.escala);
                    if (r > radioCentro - 3) break;
                    const theta = i * anguloOro;

                    const sx = f.x + r * Math.cos(theta);
                    const sy = f.y + r * Math.sin(theta);

                    ctx.beginPath();
                    ctx.arc(sx, sy, 1.5 * f.escala, 0, Math.PI * 2);
                    ctx.fillStyle = (i % 2 === 0) ? '#6d4c41' : '#ffb300';
                    ctx.fill();
                }
            }
        }

        
        function dibujarMono(progreso) {
            if (progreso <= 0) return;
            ctx.save();
            ctx.globalAlpha = progreso;
            ctx.fillStyle = '#e91e63';

            
            ctx.beginPath();
            ctx.ellipse(puntoAtadoX - 22, puntoAtadoY, 22, 12, -Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(puntoAtadoX + 22, puntoAtadoY, 22, 12, Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();

            
            ctx.beginPath();
            ctx.arc(puntoAtadoX, puntoAtadoY, 9, 0, Math.PI * 2);
            ctx.fillStyle = '#c2185b';
            ctx.fill();

            
            ctx.fillStyle = '#e91e63';
            ctx.beginPath();
            ctx.moveTo(puntoAtadoX - 5, puntoAtadoY + 5);
            ctx.lineTo(puntoAtadoX - 25, puntoAtadoY + 55);
            ctx.lineTo(puntoAtadoX - 12, puntoAtadoY + 55);
            ctx.lineTo(puntoAtadoX, puntoAtadoY + 8);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(puntoAtadoX + 5, puntoAtadoY + 5);
            ctx.lineTo(puntoAtadoX + 25, puntoAtadoY + 55);
            ctx.lineTo(puntoAtadoX + 12, puntoAtadoY + 55);
            ctx.lineTo(puntoAtadoX, puntoAtadoY + 8);
            ctx.fill();

            ctx.restore();
        }

       
        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            
            let progresoTallos = Math.min(frame / 40, 1);
            dibujarTallos(progresoTallos);

            
            let progresoHojas = Math.max(0, Math.min((frame - 25) / 25, 1));
            dibujarHojas(progresoHojas);

           
            flores.forEach(f => dibujarFlor(f, frame));

            
            let progresoMono = Math.max(0, Math.min((frame - 120) / 30, 1));
            dibujarMono(progresoMono);

            
            if (frame === 190) {
                document.getElementById('textoSorpresa').classList.add('visible');
            }

            frame++;

            if (frame <= 210) {
                idAnimacion = requestAnimationFrame(animar);
            }
        }

        
        function iniciarSorpresa() {
            document.getElementById('pantallaInicio').style.display = 'none';
            document.getElementById('contenedorRamo').style.display = 'flex';
            animar();
        }

        function reiniciarAnimacion() {
            cancelAnimationFrame(idAnimacion);
            frame = 0;
            document.getElementById('textoSorpresa').classList.remove('visible');
            animar();
        }
    </script>

</body>
</html>
